[target.'cfg(target_arch = "xtensa")']
runner = "espflash flash --monitor --log-format defmt"
# To pin a specific port: runner = "espflash flash --monitor --port /dev/ttyUSB0"
rustflags = [
	"-C",
	"link-arg=-Tdefmt.x",
	"-C",
	"link-arg=-Tlinkall.x",
	"-C",
	"force-frame-pointers",
]

[alias]
# -Z build-std is required: the distributed Xtensa Rust toolchain only ships a prebuilt std for
# the host (x86_64-unknown-linux-gnu), not for xtensa-esp32s3-none-elf - confirmed directly from
# the release archive's own component manifest, no prebuilt target std exists to install. core/
# alloc get built from source instead, using the rust-src component (already present).
build-s3 = "build -p embassy_quad --release --target xtensa-esp32s3-none-elf -Z build-std=core,alloc"
flash-s3 = "run   -p embassy_quad --release --target xtensa-esp32s3-none-elf -Z build-std=core,alloc"
build-s3-fusion = "build -p embassy_quad --release --target xtensa-esp32s3-none-elf -Z build-std=core,alloc --features telemetry"
flash-s3-fusion = "run -p embassy_quad --release --target xtensa-esp32s3-none-elf -Z build-std=core,alloc --features telemetry"

# helpers
ground_control = "build --manifest-path ground_control/Cargo.toml --target x86_64-unknown-linux-gnu"
gc = "run --release --manifest-path ground_control/Cargo.toml --target x86_64-unknown-linux-gnu"
visualize = "build --manifest-path visualizer/Cargo.toml --target x86_64-unknown-linux-gnu"

# erase-flash/erase-calibration used to live here as aliases, but cargo aliases can only
# dispatch to another cargo command, never to an arbitrary external command like espflash -
# "!espflash ..." looked like it worked (matches git's alias syntax) but actually just failed
# with "no such command: `!espflash`" every time it ran, confirmed empirically. Real versions
# are scripts/erase-flash.sh and scripts/erase-calibration.sh now.

[env]
DEFMT_LOG = "info"
