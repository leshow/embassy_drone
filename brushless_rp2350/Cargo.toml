[package]
name = "brushless_rp2350"
version = "0.1.0"
edition = "2024"

[dependencies]
embassy-executor = { version = "0.10", features = [
    "defmt",
    "platform-cortex-m",
    "executor-thread",
] }
embassy-time = { version = "0.5", features = [
    "defmt",
    "defmt-timestamp-uptime",
] }
embassy-rp = { version = "0.10", features = [
    "defmt",
    "rp235xa",
    "time-driver",
    "critical-section-impl",
    "binary-info",
] }
embedded-hal-async = "1.0"
embedded-hal-bus = { version = "0.3", features = ["async", "defmt-03"] }
embassy-dshot = { version = "0.3", features = ["rp2350", "defmt"] }
embassy-sync = "0.8.0"

defmt = "1"
defmt-rtt = "1"
crsf = "2"
cortex-m = { version = "0.7", features = ["inline-asm"] }
cortex-m-rt = "0.7"
critical-section = "1"
icm426xx = { version = "0.4", features = ["async", "defmt"] }
libm = "0.2.16"
nalgebra = { version = "0.35", default-features = false, features = [
    "libm-force",
] }
panic-probe = { version = "1", features = ["print-defmt"] }
static_cell = "2"

libs = { path = "../libs", default-features = false }

[features]
default = []
test_oneshot = []
test_dshot = []
visualize = []

[profile.release]
debug = true
lto = true
opt-level = "s"

[profile.dev]
debug = 2
