[toolchain]
# S3 (Xtensa) requires this "esp" channel, installed via espup - it's not part
# of upstream Rust. Install: `cargo install espup && espup install`, then
# source the LIBCLANG_PATH/PATH exports it prints (or ~/export-esp.sh) before
# building.
channel = "esp"
components = ["rustfmt", "clippy"]
targets = ["xtensa-esp32s3-none-elf"]
