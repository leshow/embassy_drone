on: [push, pull_request]

name: CI

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    # ground_control/visualizer/libs are plain x86 stable builds - only firmware needs the
    # esp toolchain pinned by rust-toolchain.toml, so override it back to stable here
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # check the three stable-toolchain workspaces (brushless_rp2350 has its own job)
      - run: cargo fmt --all -- --check
      - run: cargo fmt --all --manifest-path ground_control/Cargo.toml -- --check
      - run: cargo fmt --all --manifest-path visualizer/Cargo.toml -- --check

  test-libs:
    name: Test libs (${{ matrix.name }})
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    strategy:
      matrix:
        include:
          - name: no features
            args: ""
          - name: telemetry
            args: --features telemetry
          - name: telemetry-verbose
            args: --features telemetry-verbose
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p libs ${{ matrix.args }}

  check-firmware:
    name: Check firmware (${{ matrix.name }})
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      matrix:
        include:
          - name: default
            features: s3
          - name: telemetry
            features: s3,telemetry
          - name: calibrate
            features: s3,calibrate
          - name: mag+calibrate
            features: s3,mag,calibrate
    steps:
      - uses: actions/checkout@v4
      - uses: esp-rs/xtensa-toolchain@v1.7.0
        with:
          default: true
          buildtargets: esp32s3
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p embassy_quad --target xtensa-esp32s3-none-elf -Z build-std=core,alloc --no-default-features --features ${{ matrix.features }}

  clippy-firmware:
    name: Clippy firmware (${{ matrix.name }})
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      matrix:
        include:
          - name: default
            features: s3
          - name: telemetry
            features: s3,telemetry
          - name: calibrate
            features: s3,calibrate
          - name: mag+calibrate
            features: s3,mag,calibrate
    steps:
      - uses: actions/checkout@v4
      - uses: esp-rs/xtensa-toolchain@v1.7.0
        with:
          default: true
          buildtargets: esp32s3
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p embassy_quad --target xtensa-esp32s3-none-elf -Z build-std=core,alloc --no-default-features --features ${{ matrix.features }} -- -D warnings

  brushless-rp2350:
    name: Check brushless_rp2350
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # its own workspace (excluded from the root one) on stable + thumbv8m, matching
      # brushless_rp2350/rust-toolchain.toml - not the esp channel the root pins
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv8m.main-none-eabihf
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: brushless_rp2350
      # working-directory, not --manifest-path like the jobs below: cargo reads
      # .cargo/config.toml relative to the cwd, and brushless_rp2350's is what sets
      # [build] target. from the root this no_std crate would build for x86 and fail
      - run: cargo fmt --all -- --check
        working-directory: brushless_rp2350
      # no --all-targets - it pulls in the test harness, which needs the `test` crate
      # and doesn't exist for a no_std target
      - run: cargo clippy -- -D warnings
        working-directory: brushless_rp2350

  check-ground-control:
    name: Check ground_control
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ground_control
      # gilrs uses pkg-config to find libudev at build.rs time
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - run: cargo check --manifest-path ground_control/Cargo.toml

  clippy-ground-control:
    name: Clippy ground_control
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ground_control
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - run: cargo clippy --manifest-path ground_control/Cargo.toml -- -D warnings

  check-visualizer:
    name: Check visualizer
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: visualizer
      # miniquad needs X11/GL headers for its build script
      - run: sudo apt-get update && sudo apt-get install -y libx11-dev libxi-dev libgl-dev libxrandr-dev
      - run: cargo check --manifest-path visualizer/Cargo.toml

  clippy-visualizer:
    name: Clippy visualizer
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: visualizer
      - run: sudo apt-get update && sudo apt-get install -y libx11-dev libxi-dev libgl-dev libxrandr-dev
      - run: cargo clippy --manifest-path visualizer/Cargo.toml -- -D warnings
