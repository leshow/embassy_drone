[package]
name = "embassy_quad"
version = "0.1.0"
edition = "2024"

[dependencies]
embassy-executor = "0.10"
embassy-time = "0.5"
esp-hal = { version = "1.1", features = ["unstable"] }
esp-rtos = { version = "0.3", features = ["embassy", "esp-radio"] }
esp-bootloader-esp-idf = { version = "0.5" }
esp-storage = { version = "0.9" }
embedded-storage = "0.3"
esp-backtrace = { version = "0.19", features = [
	"panic-handler",
	"defmt",
	"custom-pre-backtrace",
	"custom-halt",
] }
esp-println = { version = "0.17", default-features = false, features = [
	"jtag-serial",
	"defmt-espflash",
] }
embedded-hal-async = "1.0"
defmt = "1"
esp-radio = { version = "0.18.0", features = ["wifi"] }
esp-alloc = { version = "0.10.0" }
esp-sync = { version = "0.2.1" }
embedded-hal-bus = { version = "0.3", features = ["async"] }
embassy-net = { version = "0.9", features = [
	"udp",
	"medium-ethernet",
	"proto-ipv4",
] }
embassy-sync = "0.8"
static_cell = "2"
# external non-embassy/hal libs
icm20948-async = { path = "../vendor/icm20948-async" }
mpu9250-async = { version = "0.1" }
uf-ahrs = "0.2.1"
libm = "0.2.16"
nalgebra = { version = "0.35", default-features = false, features = [
	"libm-force",
] }
libs = { path = "../libs", default-features = false }

[features]
default = ["s3"]
calibrate = [
] # you will also have to manually edit the .cargo/config.toml to remove --monitor
test_motors = []
visualize = []
# magnetometer support - init'd on hardware, and (with calibrate) runs mag calibration.
# on its own (without calibrate) does nothing yet - live-flight mag fusion isn't wired up
mag = []
telemetry = ["libs/telemetry"]
telemetry-verbose = ["telemetry", "libs/telemetry-verbose"]
s3 = [
	"esp-hal/esp32s3",
	"esp-rtos/esp32s3",
	"esp-bootloader-esp-idf/esp32s3",
	"esp-backtrace/esp32s3",
	"esp-println/esp32s3",
	"esp-radio/esp32s3",
	"esp-storage/esp32s3",
	"esp-sync/esp32s3",
]
